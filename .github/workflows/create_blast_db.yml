name: Create BLAST Databases

# Deliberately NOT triggered by merging a config.
#
# It used to be `pull_request: types: [closed]`, so every merged PR touching a
# .json started a build on the self-hosted runner. Four things made that
# dangerous rather than merely surprising:
#
#   * `timeout-minutes: 5` against config sets whose sources run to several GB.
#     The ALLIANCE set is ~4.5 GB compressed; it cannot download in five
#     minutes, so the job was cancelled part-way through every time.
#   * `cancel-in-progress: true` meant a second merge killed the first build
#     mid-write.
#   * It ran from the repository root, so the pipeline's `../data` relative
#     paths resolved to /home/ec2-user/gitroot/data -- not the real tree under
#     agr_blastdb_manager -- and a build wrote into the wrong place.
#   * The environment was taken from `basename | cut -d'.' -f3`, which gives
#     "test" for databases.SGD.test.2025-10-07.json and "5" for
#     databases.XB.5.5.1.json. It is a required input now rather than derived:
#     `metadata.release` cannot stand in for it either, being free text that
#     reads "SGD:R64-5-1" in one config and "XB 5.5.1", with a space, in
#     another. The environment names a directory, so whoever dispatches the
#     build says what it is.
#
# Real builds are run by hand (src/blast_db_creation.log is current and 2 MB;
# the repository-root copy is empty), so nothing is lost by requiring a
# deliberate dispatch. Merging a config is a config change; building databases
# from it is a separate decision with its own timing.
on:
  workflow_dispatch:
    inputs:
      json_file:
        description: 'Path to the config, e.g. conf/ALLIANCE/databases.ALLIANCE.prod.json'
        required: true
        type: string
      environment:
        description: 'Environment to build as, e.g. prod or WS298. Names the directory under /var/sequenceserver-data/blast/<MOD>/.'
        required: true
        type: string

jobs:
  create-blast-db:
    runs-on: blast2
    # A full set downloads several GB and runs makeblastdb over it.
    timeout-minutes: 360
    concurrency:
      group: blast-${{ github.ref }}
      # NOT cancel-in-progress: killing a build part-way through leaves a
      # half-written database behind.
      cancel-in-progress: false

    steps:
      - name: Checkout configuration repository
        uses: actions/checkout@v4
        with:
          path: config

      - name: Check the inputs before downloading anything
        id: env
        run: |
          set -euo pipefail
          CONFIG="$GITHUB_WORKSPACE/config/${{ inputs.json_file }}"
          test -f "$CONFIG" || { echo "no such config: ${{ inputs.json_file }}"; exit 1; }

          ENVIRONMENT="${{ inputs.environment }}"
          # It becomes a path segment, so refuse anything that is not one.
          case "$ENVIRONMENT" in
            *[!A-Za-z0-9._-]*|""|.|..)
              echo "environment must be a single path segment of [A-Za-z0-9._-]: '$ENVIRONMENT'"
              exit 1 ;;
          esac

          echo "Building $CONFIG as environment '$ENVIRONMENT'"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"

      - name: Run BLAST DB creation
        run: |
          set -euo pipefail
          cd /home/ec2-user/gitroot/agr_blastdb_manager
          git pull origin main
          # From src/: the pipeline resolves ../data, ../logs and ../config
          # relative to the working directory.
          cd src
          # uv, not poetry -- this repository moved to uv.
          uv run python create_blast_db.py \
            -j "${{ steps.env.outputs.config }}" \
            -u \
            -e "${{ steps.env.outputs.environment }}" \
            --validate
